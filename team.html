<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team &middot; Research Group</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="index.html" data-config="group_name">Research Group</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="team.html">Team</a>
        <a href="publications.html">Publications</a>
        <a href="blog.html">Blog</a>
        <a href="gallery.html">Gallery</a>
      </nav>
    </div>
  </header>

  <!-- Header image: replace images/headers/team.jpg -->
  <section class="banner" style="background-image: url('images/headers/team.jpg')">
    <div class="banner-overlay"></div>
    <div class="banner-content">
      <p class="banner-label" data-config="group_name">Research Group</p>
      <h1>Team</h1>
      <div class="banner-divider"></div>
    </div>
  </section>

  <main>
    <p id="team-status-msg" class="status-msg">Loading team...</p>

    <div id="role-legend" class="role-legend" hidden></div>

    <section id="team-section-current" class="team-section" hidden>
      <h2>Current Members</h2>
      <div id="team-grid-current" class="team-grid"></div>
    </section>

    <section id="team-section-past" class="team-section" hidden>
      <h2>Past Members</h2>
      <div id="team-grid-past" class="team-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Contact: <a data-config="contact_email" data-config-href="contact_mailto" href="#">email</a>
      &middot; <a data-config-href="scholar_url" href="#" target="_blank" rel="noopener">Google Scholar</a>
    </p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/team.js"></script>
</body>
</html>
