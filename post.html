<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog &middot; Research Group</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="index.html" data-config="group_name">Research Group</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="team.html">Team</a>
        <a href="publications.html">Publications</a>
        <a href="blog.html">Blog</a>
        <a href="gallery.html">Gallery</a>
      </nav>
    </div>
  </header>

  <!-- A single blog post. Uses the post's own "image" if set, otherwise the blog header image. -->
  <section id="post-banner" class="banner" style="background-image: url('images/headers/blog.jpg')">
    <div class="banner-overlay"></div>
    <div class="banner-content">
      <p class="banner-label" id="post-date"></p>
      <h1 id="post-title">Blog</h1>
      <p class="banner-title" id="post-author"></p>
      <div class="banner-divider"></div>
    </div>
  </section>

  <main>
    <article id="post-body" class="prose">
      <p class="status-msg">Loading post...</p>
    </article>
    <p class="post-back"><a href="blog.html">&larr; All posts</a></p>
  </main>

  <footer class="site-footer">
    <p>Contact: <a data-config="contact_email" data-config-href="contact_mailto" href="#">email</a>
      &middot; <a data-config-href="scholar_url" href="#" target="_blank" rel="noopener">Google Scholar</a>
    </p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
